<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Reporte Vegetales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 50px;
        }

        th, td {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
            font-size: 12px;
        }
        /* Ponemos el fondo de la cabecera del mismo color verde que tu DataGridView */
        th {
            background-color: #3CB371;
            color: white;
        }
    </style>
</head>
<body>
    <h2>Reporte de Catálogo de Vegetales - @FECHA</h2>
    <table>
        <thead>
            <tr>
                @CABECERAS
            </tr>
        </thead>
        <tbody>
            @FILAS
        </tbody>
    </table>
</body>
</html>
