<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Reporte de Stock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 11px;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 50px;
        }

        th, td {
            border: 1px solid black;
            padding: 4px;
            text-align: center;
            font-size: 10px; /* Fuente más chica para acomodar múltiples columnas */
        }

        th {
            background-color: #3CB371; /* Verde acorde al diseño de la grilla */
            color: white;
        }
    </style>
</head>
<body>
    <h2>Reporte General de Stock - @FECHA</h2>
    <table>
        <thead>
            <tr>
                @CABECERAS
            </tr>
        </thead>
        <tbody>
            @FILAS
        </tbody>
    </table>
</body>
</html>
