<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            text-align: center;
            color: #2e7d32;
        }

        .fecha {
            font-size: 12px;
            text-align: right;
            margin-bottom: 15px;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        /* 🔹 Agregamos text-align: center para centrar los títulos */
        th {
            background-color: #2e7d32;
            color: white;
            padding: 8px;
            font-size: 11px;
            border: 1px solid #2e7d32;
            text-align: center;
        }

        td {
            padding: 6px;
            border: 1px solid #ccc;
            font-size: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>REPORTE GENERAL DE ANIMALES</h2>
    <div class="fecha">Fecha de emisión: @FECHA</div>
    <table>
        <thead>
            <tr>
                @CABECERAS
            </tr>
        </thead>
        <tbody>
            @FILAS
        </tbody>
    </table>
</body>
</html>
